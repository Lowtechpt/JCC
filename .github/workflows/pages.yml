# Pré-visualização no GitHub Pages: https://lowtechpt.github.io/JCC/
# Cada push para main faz o build estático de site-next/ (na subpasta /JCC) e publica-o.
name: Pré-visualização (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-next/package-lock.json
      # Endereço e subpasta do site no GitHub Pages (ex.: https://lowtechpt.github.io/JCC e /JCC)
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Sem isto o GitHub Pages podia ignorar a pasta _next/
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-next/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
